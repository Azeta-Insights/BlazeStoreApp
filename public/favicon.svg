<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1938" />
      <stop offset="50%" stop-color="#141126" />
      <stop offset="100%" stop-color="#0E0C1A" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C6FE0" stop-opacity="0.4" />
    </linearGradient>

    <!-- Flame Gradient Outer -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="35%" stop-color="#FF5722" />
      <stop offset="70%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <!-- Flame Gradient Inner -->
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>

    <!-- Bag Handle / Accent -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#7C6FE0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Ambient Glow Behind Flame -->
  <circle cx="256" cy="275" r="140" fill="#FF5722" opacity="0.22" filter="url(#glow)" />
  <circle cx="256" cy="260" r="90" fill="#7C6FE0" opacity="0.25" filter="url(#glow)" />

  <!-- Stylized Shopping Bag Base silhouette behind bottom of flame -->
  <path d="M168 310 L180 398 Q182 414 198 414 L314 414 Q330 414 332 398 L344 310 Z" fill="#2E2452" opacity="0.85" />
  
  <!-- Bag Handle Loop -->
  <path d="M212 328 V290 C212 264 300 264 300 290 V328" fill="none" stroke="url(#bagGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Main Blaze Outer Flame -->
  <path d="M256 95 C256 95 292 165 292 215 C292 238 284 258 272 272 C288 262 298 244 300 224 C314 246 348 300 348 348 C348 400 306 430 256 430 C206 430 164 400 164 348 C164 290 208 236 216 200 C222 220 236 235 248 238 C238 200 256 95 256 95 Z" fill="url(#flameOuter)" filter="url(#glow)" />

  <!-- Core Inner Flame (High Heat) -->
  <path d="M256 220 C256 220 274 265 274 298 C274 314 268 328 260 338 C270 332 276 320 276 308 C286 322 304 350 304 372 C304 398 282 414 256 414 C230 414 208 398 208 372 C208 342 232 312 236 290 C240 302 248 312 254 314 C248 290 256 220 256 220 Z" fill="url(#flameInner)" />

  <!-- Sparkle Star (Top Right) -->
  <path d="M370 120 Q370 145 395 145 Q370 145 370 170 Q370 145 345 145 Q370 145 370 120 Z" fill="#FFFFFF" opacity="0.95" />
  <circle cx="370" cy="145" r="4" fill="#FFE082" />
</svg>
